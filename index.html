<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emberlock — shove wizards into lava</title>
  <meta name="description" content="A mobile arena brawler: aim fireballs, shove rival wizards into the lava, survive the shrinking island. Inspired by the classic Warcraft 3 Warlock mod.">
  <meta name="theme-color" content="#0b0712">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=1">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="spell-btns"></div>
    </div>
    <div id="screens">
      <section id="scr-menu" class="screen"></section>
      <section id="scr-ember" class="screen"></section>
      <section id="scr-draft" class="screen"></section>
      <section id="scr-shop" class="screen"></section>
      <section id="scr-matchend" class="screen"></section>
      <section id="scr-runend" class="screen"></section>
      <section id="scr-sanctum" class="screen"></section>
      <section id="scr-help" class="screen"></section>
    </div>
    <div id="toast"></div>
  </div>
  <script type="module" src="js/main.js?v=1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
